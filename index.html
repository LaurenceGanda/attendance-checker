<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Attendance Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <meta name="theme-color" content="#4361ee">
</head>
<body>
    <div class="container">
        <header>
            <h1>Attendance Tracker</h1>
            <p class="date-display"></p>
            <div class="color-scheme-container">
                <button class="color-scheme-toggle" id="color-scheme-toggle" title="Toggle color scheme menu">
                    <i class="fas fa-palette"></i>
                </button>
                <div class="color-scheme-menu" id="color-scheme-menu">
                    <div class="color-option" data-theme="default" title="Default Theme">
                        <span class="color-dot" style="background-color: #4361ee;"></span>
                        <span class="color-name">Default</span>
                    </div>
                    <div class="color-option" data-theme="ocean" title="Ocean Theme">
                        <span class="color-dot" style="background-color: #0077b6;"></span>
                        <span class="color-name">Ocean</span>
                    </div>
                    <div class="color-option" data-theme="sunset" title="Sunset Theme">
                        <span class="color-dot" style="background-color: #e76f51;"></span>
                        <span class="color-name">Sunset</span>
                    </div>
                    <div class="color-option" data-theme="forest" title="Forest Theme">
                        <span class="color-dot" style="background-color: #588157;"></span>
                        <span class="color-name">Forest</span>
                    </div>
                    <div class="color-option" data-theme="dark" title="Dark Theme">
                        <span class="color-dot" style="background-color: #1e1e1e;"></span>
                        <span class="color-name">Dark</span>
                    </div>
                    <div class="color-option" data-theme="pink" title="Pink Theme">
                        <span class="color-dot" style="background-color: #ff0080;"></span>
                        <span class="color-name">Pink</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="attendance-form">
            <h3 class="form-title"><center>Attendance Record</center></h3>
            <div class="form-grid">
                <div class="form-column">
                    <div class="input-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter name" required>
                    </div>
                    <div class="input-group">
                        <label for="subject">Subject</label>
                        <div class="subject-input-container">
                            <select id="subject-select">
                                <option value="">Select Subject</option>
                                <option value="PCTW1">PCTW1</option>
                                <option value="PDC">Parallel and Distributed Computing</option>
                                <option value="PEISS">PEISS</option>
                                <option value="custom">Enter Custom Subject</option>
                            </select>
                            <input type="text" id="subject-custom" placeholder="Enter custom subject" class="hidden">
                        </div>
                    </div>
                </div>
                <div class="form-column">
                    <div class="input-group">
                        <label for="subject-time">Time</label>
                        <input type="time" id="subject-time" value="08:00">
                    </div>
                    <div class="input-group">
                        <label for="status">Attendance Status</label>
                        <select id="status">
                            <option value="present">Present</option>
                            <option value="late">Late</option>
                            <option value="absent">Absent</option>
                            <option value="excused">Excused</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button id="add-entry"><i class="fas fa-plus"></i>Add Record</button>
            </div>
        </div>

        <div class="card">
            <div class="summary">
                <div class="stat">
                    <span id="present-count">0</span>
                    <p>Present</p>
                </div>
                <div class="stat">
                    <span id="late-count">0</span>
                    <p>Late</p>
                </div>
                <div class="stat">
                    <span id="absent-count">0</span>
                    <p>Absent</p>
                </div>
                <div class="stat">
                    <span id="excused-count">0</span>
                    <p>Excused</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search" placeholder="Search names...">
                </div>
                <button id="export-btn" class="export-button"><i class="fas fa-download"></i> <span class="export-text">Export</span></button>
            </div>
            <div class="attendance-list">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-entries">
                        <!-- Entries will be added here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 LDG Attendance Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
